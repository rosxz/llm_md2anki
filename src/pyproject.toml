[tool.poetry]
name = "llm_md2anki"
version = "0.1.0"
description = "MVP: LLM-assisted Markdown to Anki conversion"
authors = ["llm_md2anki <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
rich = "^13.0"
google-genai = "^0.8.0"
openai = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
llm-md2anki = "llm_md2anki.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
